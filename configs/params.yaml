# Every tunable number of the pipeline lives here.

seed: 0

video:
  target_width: 1280        # frames are downscaled to this width in the decoder (height keeps aspect, even)
  stride: 3                 # decode stride: every 3rd frame (29.97 / 3 ≈ 10 fps); the non-reference skip gives exactly this
  sample_fps: 10            # detector frames per second of video: sets the sampling stride (budget.sampling_stride)
  reference_pixels: 8294400 # 3840 x 2160; larger frames get a proportionally larger stride
  decoder_threads: 24       # FFmpeg frame threads; more than cores hides frame-threading latency
  skip_nonref: true         # decoder drops non-reference (B) frames; with this camera's IBBP GOP that is exactly stride 3
  skip_check_frames: 90     # frames checked at start; if the skip is not exactly every stride-th frame, decode all
  interpolation: AREA       # swscale filter for the downscale
  prefetch: 16              # frames decoded ahead in a background thread, overlapping decode with detection

detector:
  weights: weights/yolo11s.pt
  imgsz: 1280
  conf: 0.1                 # low on purpose: ByteTrack uses low-score boxes in its second association
  iou: 0.7
  classes: [0, 1, 2, 3, 5, 7]   # COCO: person, bicycle, car, motorcycle, bus, truck
  batch: 8
  fp16: true                # applied on CUDA only

tracker:
  track_high_thresh: 0.25
  track_low_thresh: 0.1
  new_track_thresh: 0.25
  track_buffer_sec: 3.0     # how long a lost track is kept, converted to sampled frames
  match_thresh: 0.8
  fuse_score: true

cache:
  enabled: true
  dir: cache

registration:               # aligning a video to the reference frame the scene was drawn on
  reference: configs/reference_frame.jpg   # C3896 middle frame, 960x540; scene.json is drawn on it
  width: 960                # edge maps are compared at this width
  iterations: 300
  eps: 1.0e-6
  sample_fractions: [0.25, 0.5, 0.75]      # frames (share of the video) whose median is aligned; removes traffic
  min_cc: 0.25              # below this ECC correlation the alignment is rejected (real videos: 0.47-0.88, noise: 0.05)
  max_shift: 0.08           # rejected if the frame centre moves more than this (normalised units)
  max_scale_change: 0.10    # rejected if the scale differs from 1 by more than this
  max_rotation_deg: 5.0     # rejected if rotated by more than this

signal:                     # traffic-light phase of avenue_near from the heads visible in the frame
  sample_fps: 2             # heads are read this often
  min_lit: 15               # chroma (levels) a lit lamp reaches at least; sun: red ~57 / green ~44, dusk: ~145
  ped_margin: 0.3           # (red - green) / (|red| + |green|) beyond +-this decides red / green
  veh_lit_fraction: 0.5     # a vehicle lamp is lit if its chroma is at least this share of the brightest lamp
  smooth_window_sec: 1.5    # majority vote over this window
  max_hold_sec: 5.0         # unknown gaps up to this long keep the previous phase (occlusion, flashing green)
  vehicle_green_after_ped_sec: 3.0   # measured on all samples: after the green man goes red, vehicles keep
  vehicle_amber_sec: 3.0             # (flashing) green for 3 s, then amber for 3 s, then red

signal_fusion:              # how the cached head readings become phases (outside `signal`, whose readings are cached)
  veh_hold_sec: 1.0         # a new vehicle-head reading counts only if it holds this long (single misreads in sun)

device_profiles:            # overrides applied on top of the settings above, by device kind
  cpu:                      # no GPU: small model, small input, fewer frames
    detector:
      weights: weights/yolo11n.pt
      imgsz: 640
      batch: 4
    video:
      sample_fps: 5
    risk:
      sample_fps: 5

budget:                     # time-limit fuse of Part A (the stride itself is chosen without timing)
  time_factor: 3.0          # harness limit: Part A + Part B <= 3 x video duration
  fuse_factor: 2.7          # Part A raises its stride only if Part A + Part B are projected over this (logged)
  part_b_probe_frames: 30   # 4K frames read with OpenCV (as the harness does) to estimate Part B
  part_b_warmup_frames: 5
  part_b_safety: 1.25       # multiplier on the estimated Part B decode time
  part_b_model_factor: 0.5  # extra Part B seconds per video second for the risk model (measured 0.77-0.99x
                            # including the ~0.5x of 4K decoding)
  part_a_tail_sec: 3.0      # reserved for rules and post-processing after tracking
  max_sample_stride: 30     # never sample fewer than 1 frame per second
  warmup_batches: 2         # detector batches ignored when measuring speed (model warm-up)

features:                   # per-sample kinematics of tracked objects; speeds in frame widths per second
  smooth_window_sec: 0.5    # centred moving average of the anchor (bottom centre of the box)
  velocity_window_sec: 0.6  # central difference span for velocity and acceleration
  stationary_speed: 0.005   # below this an object counts as standing (~19 px/s in 4K, ~0.3 m/s in the near lanes)
  heading_min_speed: 0.01   # heading is undefined (NaN) below this speed
  pedestrian_classes: [0]   # COCO person
  pedestrian_inset: 0.01    # pedestrians count as on the carriageway only this far inside its edge (frame widths)
  edge_margin: 0.003        # a box this close to the frame border is cut off by it

postprocess:                # per-frame flags -> segments; per-class values override the default
  default: {merge_gap: 1.0, min_len: 0.5}
  classes:
    stopped_vehicle: {merge_gap: 2.0, min_len: 10.0}
    congestion: {merge_gap: 5.0, min_len: 20.0}
    wrong_way: {merge_gap: 1.0, min_len: 1.0}
    jaywalking: {merge_gap: 1.0, min_len: 1.0}
    red_light: {merge_gap: 0.5, min_len: 0.5}
    stop_line: {merge_gap: 2.0, min_len: 2.0}
    failure_to_yield: {merge_gap: 0.5, min_len: 0.5}
    solid_line_crossing: {merge_gap: 0.5, min_len: 1.0}   # a lane change across a line takes at least ~1 s
    illegal_turn: {merge_gap: 1.0, min_len: 1.0}
    illegal_u_turn: {merge_gap: 1.0, min_len: 1.0}
    accident: {merge_gap: 2.0, min_len: 1.0}
    near_miss: {merge_gap: 0.5, min_len: 0.5}

rules:
  vehicle_classes: [2, 3, 5, 7]   # COCO car, motorcycle, bus, truck
  lane_width_cars: 1.2          # lane width in car box widths (measured: avenue_near, 4 lanes at the stop line)
  stopped_vehicle:
    min_stop_sec: 10.0            # definition: stationary on the carriageway for 10 s or more
    run_merge_sec: 2.0            # brief creeping inside a stop does not end it
    signal_discharge_sec: 15.0    # after green starts, the avenue_near queue takes this long to clear
    # distances below are in box widths of the standing vehicle, so they follow the perspective
    queue_gap: 1.5                # another standing vehicle this close ahead = queued behind it
    queue_lateral: 0.6            # ... and at most this far to the side
    jam_radius: 2.5               # other standing vehicles within this distance ...
    jam_neighbours: 2             # ... at least this many = the vehicle is part of a queue or jam
    overtake_radius: 3.0          # others moving past within this distance ...
    overtake_speed: 0.02          # ... faster than this (frame widths / s) ...
    overtake_max_angle: 60.0      # ... in the same direction (degrees) ...
    min_overtakers: 2             # ... at least this many distinct vehicles: the stop is real, traffic goes round it
    depart_radius: 3.0            # standing vehicles this close that move off ...
    depart_window_sec: 3.0        # ... within this many seconds of the vehicle = it was in a queue
    hidden_signal_radius: 2.5     # in a signal_queue_zone, another standing vehicle this close = queue
    yield_distance: 0.5           # vehicle anchor this close to a crossing ...
    yield_reach: 3.0              # ... with a pedestrian on it ahead of the vehicle within this ...
    yield_lateral: 0.75           # ... and in its lane (this far to the side) = yielding, not stopped
    max_yield_sec: 10.0           # yielding longer than this in one go counts as standing again
    arrive_speed: 0.02            # a stop counts only if the vehicle moved faster than this before it
  wrong_way:
    min_speed: 0.02               # moving faster than this (frame widths / s)
    against_angle: 120.0          # heading more than this from every allowed direction of the lane
    min_duration_sec: 2.0         # for at least this long in one go
    min_travel: 2.0               # having covered this many of its own box widths (not box jitter)
    run_merge_sec: 0.5            # gaps shorter than this inside a run are bridged
    review_min_sec: 1.0           # rejected runs at least this long are clipped for review
  pedestrians:                    # which person detections are real pedestrians (jaywalking, failure_to_yield)
    rider_classes: [1, 2, 3, 5, 7]  # a person whose anchor lies inside one of these boxes is riding, not walking
    min_track_travel_boxes: 3.0   # a person track that never moves this many of its box widths is a static object
    min_height: 0.03              # smaller boxes (far away) are unreliable
  jaywalking:
    min_duration_sec: 1.0         # on the road outside crossings for at least this long ...
    min_walk_m: 3.0               # ... covering at least this much on the road plane (cutting a corner included)
    crossing_margin_lanes: 0.1    # people within this many lane widths of a crossing are on it (anchor noise)
    max_speed_mps: 4.0            # a median speed above this is a scooter or a bicycle, not a pedestrian
    corner_near_lanes: 1.0        # a run starting / ending this close to a crossing or island is reported as from / to it
    standing_car_sec: 2.0         # a vehicle standing this long ...
    kerb_lanes: 0.6               # ... in a stopping zone or this close to the carriageway edge, or on a crossing ...
    car_radius_m: 3.0             # ... with the person this close: getting in / out, loading, walking round it
    run_merge_sec: 0.5
    review_min_sec: 0.4
  failure_to_yield:
    ped_margin_lanes: 0.3         # a pedestrian this close to a crossing and walking towards it is stepping onto it
    walk_speed: 0.01              # 'walking' (frame widths / s)
    path_lanes: 0.75              # in the vehicle's path: its lane (half a lane each side) plus a step
    behind_lanes: 0.25            # pedestrians more than this behind the vehicle are no longer in its way
    legal_phases: [red, red_amber, amber]  # near crossing: pedestrians have right of way only while vehicles do not have green
    along_angle: 30.0             # vehicles heading within this of the crossing's long axis ride along it (couriers), not across
    along_check_min_angle: 45.0   # ... checked only where the crossing's axis is at least this far from its lanes in the image
                                  # (perspective makes the near and far crossings look parallel to their traffic: 22-33 deg)
    min_conflict_samples: 2       # the pedestrian is in the path for at least this many samples
    min_speed: 0.01               # the vehicle drives through (moves faster than this on the crossing)
    excluded_crossings: [avenue_far]  # its signal is not visible: whether its pedestrians cross legally is unknown
    merge_track_gap_sec: 5.0      # one vehicle = one event: its passes closer than this are joined
  red_light:
    red_phases: [red, red_amber]  # vehicle phases in which crossing the stop line is a violation
    phase_grace_sec: 1.0          # crossings this close to the start or end of red are within the phase-reading uncertainty
    review_window_sec: 3.0        # crossings up to this long before red / in amber are clipped as close calls
  stop_line:
    min_stop_sec: 1.0             # standing at least this long ...
    front_past: 0.35              # ... with the vehicle front this many box widths past the stop line (line accuracy ~0.3) ...
    max_past: 2.0                 # ... but not further (beyond the near crossing starts the intersection) ...
    red_phases: [red, red_amber]  # ... while the vehicle phase is red ...
    arrive_phases: [red, red_amber, amber]  # ... having got past the line (front_past) on one of these ...
    arrive_before_red_sec: 10.0   # ... or on green at most this long before red (not stuck there in a jam since earlier)
  congestion:
    min_vehicles: 5               # vehicles in the lane
    crawl_speed: 0.015            # median speed below this (frame widths / s) = standstill or crawling
    smooth_sec: 5.0               # rolling median of the per-frame counts and speeds
    min_duration_sec: 90.0        # longer than one signal cycle (75 s measured), so red-light queues do not count
  illegal_turn:                 # approach A lanes (scene.json approach_lanes), see rules/lanes.py
    lane_margin: 0.03             # crossing the stop line this close (along the line) to a lane boundary: lane uncertain
    straight_lanes: [avenue_exit]          # reaching this = went straight on (not a turn)
    left_lanes: [avenue_entry, avenue_far]  # reaching one of these = turned left
    turn_start_deg: 20.0          # a turn starts when the heading leaves the approach direction by this much
    min_speed: 0.01               # ... while moving (frame widths / s)
  solid_line_crossing:
    stable_sec: 1.0               # on the old side this long before and on the new side this long after
    clear_boxes: 0.25             # ... at least this many box widths away from the line (not jitter along it)
    extent_margin: 0.02           # crossings within this share of a line's length from its ends do not count
    min_speed: 0.01               # moving at the crossing (frame widths / s)
    min_len_sec: 0.5
  accident:                     # road-plane units (car box widths, risk.ground), see rules/collisions.py
    footprint_depth: 0.35         # the bottom strip of a box, this fraction of its height, is its footprint on the road
    check_radius: 3.0             # footprints are compared for pairs whose anchors are this close
    contact_gap: 0.1              # footprints this close = contact
    min_closing: 2.0              # the two approached each other at least this fast just before the contact (/ s)
    before_sec: 1.0               # speed before the contact: the highest in this window ...
    after_sec: 1.5                # ... speed after it: the lowest in this window
    min_speed_drop: 2.0           # both lose at least this much speed (car box widths / s)
    settle_sec: 5.0               # both stand still (or leave the frame) within this ...
    stand_sec: 2.0                # ... for at least this long
    exit_margin: 0.03             # a track ending this close to the frame border left the frame (else it was lost)
    max_box_speed: 8.0            # a box moving faster than this many of its widths per second between samples ...
    max_size_ratio: 1.5           # ... or changing its width by more than this = tracker switched objects
    min_len_sec: 1.0              # shortest segment
  near_miss:                    # road-plane units (car box widths, risk.ground), see rules/collisions.py
    pair_radius: 10.0             # pairs of road users further apart are not considered
    min_vehicle_width: 0.03       # pairs (both rules): vehicles narrower (far away) are too coarse on the road plane
    contact_radius: 0.2           # time to contact (risk.pair_ttc): anchors this close = contact ...
    pedestrian_contact_radius: 0.3
    min_gap: 0.3                  # ... pairs already this much closer are side by side, not approaching
    min_closing_speed: 2.0        # ... approaching at least this fast (/ s)
    horizon_sec: 5.0
    max_ttc: 1.0                  # a near miss needs a time to contact below this ...
    run_merge_sec: 0.5
    react_before_sec: 1.0         # ... and hard braking or a swerve of either from this long before ...
    react_after_sec: 1.0          # ... to this long after it
    min_speed: 1.0                # braking / swerving only counts while moving at least this fast (/ s)
    brake_decel: 13.0             # hard braking (/ s^2): above 99.9% of moving vehicles on the samples (12.9) ...
    swerve_accel: 8.0             # ... swerve: across the direction of motion (/ s^2; 99.9%: 4.3) ...
    evasive_min_samples: 2        # ... for at least this many consecutive samples
    reliable_sec: 2.0             # both tracks continuous and trustworthy this long before and after the event:
    max_gap_sec: 0.3              # ... no gaps longer than this, no leaps, not touching the gantry or poles
    follow_angle: 30.0            # headings closer than this (degrees) ...
    same_lane: 0.6                # ... and less than this far to the side (car box widths) = following in one lane
    separation: 2.0               # the segment ends when the two are this far apart again
    after_sec: 3.0                # neither may come to a stop within this long after the closest approach ...
    stop_sec: 1.0                 # ... (standing this long); leaving the frame is fine
    min_len_sec: 0.5

risk:                       # Part B, src/risk.py; distances and speeds on the ground plane, in car box widths
  ground:                   # image -> road plane (risk.ground_plane), measured on the samples
    horizon_y: -0.07        # row where the car box width model reaches zero (features.fit_car_width: 0.14 * y + 0.01)
    width_slope: 0.141      # car box width (frame widths) per unit of y
    focal: 1.6              # frame widths; from the vanishing points of the avenue (tracks) and of its crossings
    box_width_m: 2.9        # metres per car box width on the road plane (a lane: 1.2 box widths ~ 3.5 m)
  sample_fps: 10            # detect + track this many frames per second of video (stride = fps / this);
                            # other frames return the last score
  max_stride: 12
  frame_width: 960          # 4K frames are resized to this width (a 4x reduction: OpenCV fast path)
  imgsz: 960                # detector input size
  realtime_fuse: 2.0        # time fuse: the stride grows only if Part B runs slower than this x real time
                            # (harness decoding included; logged)
  pace_warmup_steps: 10     # processed frames ignored when measuring the pace (model warm-up)
  pace_min_sec: 10.0        # the fuse judges the pace over at least this much video (one-off hiccups do not count)
  registration_sec: 2.0     # the scene is aligned on the median of the frames seen in the first seconds
  registration_frames: 10
  history_sec: 1.5          # track history kept per object
  velocity_window_sec: 1.0  # velocity = linear fit over this window; acceleration = change between its halves
  min_track_samples: 4
  min_track_span_sec: 0.6    # velocity needs at least this much track history
  min_speed: 0.3            # moving (car box widths / s)
  pair_radius: 10.0         # pairs further apart than this are not considered
  contact_radius: 0.2       # vehicle - vehicle: anchors this close = contact (neighbouring lanes pass ~1 apart)
  pedestrian_contact_radius: 0.6
  min_closing_speed: 6.0    # car box widths / s; slower approaches are ordinary traffic (queues, overtaking)
  min_gap: 0.3              # pairs already closer than contact + this (side by side, queues) are skipped
  horizon_sec: 5.0          # only contacts expected within this time count
  tau0: 1.5                 # TTC giving 0.5 before bonuses
  slope: 3.0                # sigmoid slope (1 / s)
  brake_decel: 8.0          # decelerating faster than this (car box widths / s^2) is hard braking ...
  brake_bonus: 0.15         # ... and adds this (scaled up to 2x the threshold)
  wrong_way_sec: 1.0        # a vehicle against its lane for this long ...
  wrong_way_bonus: 0.25     # ... adds this
  pedestrian_radius: 2.0    # a pedestrian on the road this close to a moving vehicle ...
  pedestrian_min_closing: 0.5   # ... that approaches them (car box widths / s) ...
  pedestrian_crossing_margin: 0.5  # ... and more than this many lane widths from any crossing ...
  pedestrian_bonus: 0.15    # ... adds this
  ema_alpha: 0.35           # smoothing per processed frame
                            # calibrated with tools/risk_report.py --replay: 1 alarm on the 18 min of samples
